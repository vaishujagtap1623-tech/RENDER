spring.application.name=java-studio-backend
server.port=${PORT:8080}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/java_studio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
